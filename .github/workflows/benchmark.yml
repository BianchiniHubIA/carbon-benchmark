name: benchmark

on:
  workflow_dispatch:

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq hyperfine rustc || true

      - name: Run benchmark
        run: bash run_bench.sh

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: results
          path: |
            RESULTS.md
            out/*.compile.log
          if-no-files-found: ignore
